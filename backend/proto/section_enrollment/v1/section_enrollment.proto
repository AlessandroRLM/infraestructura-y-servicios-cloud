syntax = "proto3";

package section_enrollment.v1;

option go_package = "github.com/AlessandroRLM/infraestructura-y-servicios-cloud/backend/gen/section_enrollment/v1;section_enrollmentv1";

service SectionEnrollmentService {
  // Student self-service procedures — student identity derived from session context.

  // EnrollOwnSection creates a section inscription for the authenticated student.
  // Requires sections.enroll permission. Window-gated: only allowed when now() falls
  // within the academic period's enrollment window.
  rpc EnrollOwnSection(EnrollOwnSectionRequest) returns (SectionEnrollment);

  // ListOwnSectionEnrollments returns all live section inscriptions for the
  // authenticated student. No student_id in request; identity comes from context.
  rpc ListOwnSectionEnrollments(ListOwnSectionEnrollmentsRequest) returns (ListSectionEnrollmentsResponse);

  // GetOwnSectionEnrollment returns a section inscription by id only if the caller
  // owns it. Ownership mismatch returns CodeNotFound — existence is never disclosed.
  rpc GetOwnSectionEnrollment(GetOwnSectionEnrollmentRequest) returns (SectionEnrollment);

  // Admin-managed procedures — require enrollment.manage permission.

  // EnrollSection creates or revives a section inscription for any student.
  // Not window-gated. Can revive a withdrawn inscription (re-checks capacity).
  rpc EnrollSection(EnrollSectionRequest) returns (SectionEnrollment);

  // WithdrawSection transitions an in_progress inscription to withdrawn.
  // Admin-only; withdrawal is not available to students.
  rpc WithdrawSection(WithdrawSectionRequest) returns (WithdrawSectionResponse);

  // GetSectionEnrollment returns any live section inscription by id.
  rpc GetSectionEnrollment(GetSectionEnrollmentRequest) returns (SectionEnrollment);

  // ListSectionEnrollments returns live section inscriptions with optional filters.
  rpc ListSectionEnrollments(ListSectionEnrollmentsRequest) returns (ListSectionEnrollmentsResponse);

  // Teacher teaching-scope procedures — require section_enrollment.view_teaching permission.

  // ListSectionRosterForTeacher returns the paginated roster of students enrolled in a
  // specific section that the authenticated user teaches. Teacher identity is derived from
  // the session context; existence of the section is never disclosed if the caller is not
  // a teacher of the section (empty page, not PermissionDenied).
  rpc ListSectionRosterForTeacher(ListSectionRosterForTeacherRequest) returns (ListSectionRosterForTeacherResponse);

  // Student discovery procedure — requires sections.enroll permission.

  // ListEnrollableSections returns the sections a student may self-enroll into.
  // Eligibility gates: paid enrollment in a program that contains the section's course,
  // year match, open enrollment window, available capacity, and not already enrolled.
  // Student identity is derived exclusively from the session context.
  rpc ListEnrollableSections(ListEnrollableSectionsRequest) returns (ListEnrollableSectionsResponse);
}

// SectionEnrollment represents a single section inscription record.
// No created_by / updated_by fields: this entity is not in the sensitive-changes list.
message SectionEnrollment {
  string id = 1;
  string enrollment_id = 2;
  string section_id = 3;
  // status is one of "in_progress", "passed", "failed", or "withdrawn".
  // passed/failed are set only by the grades slice; this service only sets in_progress/withdrawn.
  string status = 4;
  string registered_at = 5;
  string created_at = 6;
  string updated_at = 7;
  optional string deleted_at = 8;
  // final_grade is the computed weighted average set by the grades slice when status
  // transitions to passed or failed. Empty string when the grade has not yet been computed
  // (status is in_progress or withdrawn).
  string final_grade = 9;
  // student_id is the user_id of the student who owns this section enrollment.
  // Populated only when using the teacher-scoped ListSectionRosterForTeacher RPC;
  // empty string on other RPCs that return SectionEnrollment (backward-compatible addition).
  string student_id = 10;
  // course_name is the display name of the course for this section.
  // Populated only by ListOwnSectionEnrollments; empty on all other RPCs (backward-compatible).
  string course_name = 11;
  // course_code is the short code of the course for this section.
  // Populated only by ListOwnSectionEnrollments; empty on all other RPCs (backward-compatible).
  string course_code = 12;
  // period_year is the calendar year of the academic period that contains this section.
  // Populated only by ListOwnSectionEnrollments; zero on all other RPCs (backward-compatible).
  int32 period_year = 13;
  // period_term is the term number within the academic year (e.g. 1 or 2) of the academic period.
  // Populated only by ListOwnSectionEnrollments; zero on all other RPCs (backward-compatible).
  int32 period_term = 14;
}

// EnrollOwnSectionRequest carries section_id and program_id.
// The program_id disambiguates which paid enrollment to link when a student is enrolled
// in more than one program. The student_id is derived exclusively from the session context.
message EnrollOwnSectionRequest {
  string section_id = 1;
  string program_id = 2;
}

// ListOwnSectionEnrollmentsRequest supports AIP-158 keyset pagination.
message ListOwnSectionEnrollmentsRequest {
  // Maximum number of inscriptions to return. Clamped to [20, 200]; zero → 20.
  int32 page_size = 1;
  // Opaque cursor returned by a previous ListOwnSectionEnrollments call.
  // Empty string returns the first page.
  string page_token = 2;
}

message GetOwnSectionEnrollmentRequest {
  string id = 1;
}

message EnrollSectionRequest {
  string enrollment_id = 1;
  string section_id = 2;
}

message WithdrawSectionRequest {
  string id = 1;
}

message WithdrawSectionResponse {}

message GetSectionEnrollmentRequest {
  string id = 1;
}

// ListSectionEnrollmentsRequest supports optional filters and AIP-158 keyset pagination.
// An empty request returns the first page of all live inscriptions.
message ListSectionEnrollmentsRequest {
  // Optional UUID filter. Empty string means unfiltered.
  string section_id = 1;
  // Optional UUID filter. Empty string means unfiltered.
  string enrollment_id = 2;
  // Optional status filter ("in_progress", "withdrawn", etc.). Empty string means unfiltered.
  string status = 3;
  // Maximum number of inscriptions to return. Clamped to [20, 200]; zero → 20.
  int32 page_size = 4;
  // Opaque cursor returned by a previous ListSectionEnrollments call.
  // Empty string returns the first page.
  string page_token = 5;
}

message ListSectionEnrollmentsResponse {
  repeated SectionEnrollment section_enrollments = 1;
  // Opaque cursor for the next page. Empty when this is the last page.
  // Used by both ListSectionEnrollments and ListOwnSectionEnrollments (shared response).
  string next_page_token = 2;
}

// ListSectionRosterForTeacherRequest carries the target section_id and pagination params.
// No teacher_id field — caller identity is derived exclusively from session context.
message ListSectionRosterForTeacherRequest {
  // section_id must be a valid UUID string.
  string section_id = 1;
  // Maximum number of roster entries to return. Clamped to [20, 200]; zero → 20.
  int32 page_size = 2;
  // Opaque cursor returned by a previous ListSectionRosterForTeacher call.
  // Empty string returns the first page.
  string page_token = 3;
}

// ListSectionRosterForTeacherResponse is the dedicated response for the teacher-scoped roster RPC.
// Each SectionEnrollment row includes student_id so the caller can resolve display names.
message ListSectionRosterForTeacherResponse {
  repeated SectionEnrollment section_enrollments = 1;
  // Opaque cursor for the next page. Empty when this is the last page.
  string next_page_token = 2;
}

// ListEnrollableSectionsRequest supports AIP-158 keyset pagination.
// No student_id field — identity comes exclusively from the session context.
message ListEnrollableSectionsRequest {
  // Maximum number of sections to return. Clamped to [20, 200]; zero → 20.
  int32 page_size = 1;
  // Opaque cursor returned by a previous ListEnrollableSections call.
  // Empty string returns the first page.
  string page_token = 2;
}

// EnrollableSection represents a section a student may self-enroll into.
// program_id is the program the student must pass to EnrollOwnSection to disambiguate
// which paid enrollment to link.
message EnrollableSection {
  // section_id is the UUID of the enrollable section.
  string section_id = 1;
  // program_id is the UUID of the program (career) the student has a paid enrollment in
  // that covers this section's course. Pass this to EnrollOwnSection.
  string program_id = 2;
  // course_name is the display name of the course.
  string course_name = 3;
  // course_code is the short code of the course.
  string course_code = 4;
  // period_year is the calendar year of the academic period.
  int32 period_year = 5;
  // period_term is the term number within the academic year (e.g. 1 or 2).
  int32 period_term = 6;
  // seats_available is the number of remaining seats (capacity - active enrollments).
  // Always >= 1 (sections with 0 available seats are excluded from this list).
  int32 seats_available = 7;
}

// ListEnrollableSectionsResponse is the paginated response for ListEnrollableSections.
message ListEnrollableSectionsResponse {
  repeated EnrollableSection sections = 1;
  // Opaque cursor for the next page. Empty when this is the last page.
  string next_page_token = 2;
}
